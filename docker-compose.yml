version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./digital_fossil.db
      - SECRET_KEY=digital-fossil-production-demo-key-2026!
      - DEFAULT_SESSION_THRESHOLD_SECONDS=120
      - DEFAULT_MIN_RELATIONSHIP_SCORE=0.35
      - DEFAULT_ANOMALY_CONTAMINATION=0.10
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
